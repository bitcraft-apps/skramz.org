version: '3'

dotenv: ['.env']

tasks:
  dev:
    deps: [dev:api, dev:web]

  dev:api:
    dir: api
    cmd: pnpm dev

  dev:web:
    dir: web
    cmd: pnpm dev

  build:api:
    dir: api
    cmd: pnpm build

  build:web:
    dir: web
    cmd: pnpm build

  test:
    deps: [test:api, test:web, test:cli]

  test:api:
    dir: api
    cmd: pnpm test

  test:web:
    dir: web
    cmd: pnpm vitest run

  test:cli:
    dir: cli-agent
    cmd: go test ./...

  migrate:
    desc: Apply D1 migrations locally
    dir: api
    cmd: pnpm exec wrangler d1 migrations apply DB --local

  migrate:prod:
    desc: Apply D1 migrations to production (explicit only)
    dir: api
    cmd: pnpm exec wrangler d1 migrations apply DB --remote

  seed:
    desc: Apply a seed file to local D1, then fail on any _verify.sql row (usage task seed SEED=<file.sql>)
    dir: api
    cmds:
      - |
        if [ -z "{{.SEED}}" ]; then echo "usage: task seed SEED=<file.sql>" >&2; exit 2; fi
        case "{{.SEED}}" in
          */*|*..*) echo "refusing SEED with path separator or ..: use a basename like band.sql" >&2; exit 2;;
          *.sql) ;;
          *) echo "refusing SEED without .sql suffix" >&2; exit 2;;
        esac
        pnpm exec wrangler d1 execute DB --local --file="seeds/{{.SEED}}"
        OUT=$(pnpm exec wrangler d1 execute DB --local --json --file=seeds/_verify.sql)
        echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s).flatMap(x=>x.results||[]);if(rows.length){for(const r of rows)console.log(JSON.stringify(r));console.error('seed verify failed: '+rows.length+' row(s)');process.exit(1)}console.log('seed verify clean')})"

  verify:remote-cascade:
    desc: Verify FK/ON DELETE CASCADE on remote D1 (issue #23; needs Cloudflare auth env)
    dir: api
    cmd: ./scripts/verify-fk-cascade.sh --remote

  evidence:
    desc: Apply a per-band evidence update to local D1, then fail on any _verify.sql row (usage task evidence BAND=<slug> N=<nnn-name.sql>)
    dir: api
    cmds:
      - |
        if [ -z "{{.BAND}}" ] || [ -z "{{.N}}" ]; then echo "usage: task evidence BAND=<slug> N=<nnn-name.sql>" >&2; exit 2; fi
        case "{{.BAND}}/{{.N}}" in
          *..*|*/*/*) echo "refusing BAND/N with .. or extra separators: seeds/<slug>/<nnn-name.sql>" >&2; exit 2;;
          *.sql) ;;
          *) echo "refusing N without .sql suffix" >&2; exit 2;;
        esac
        pnpm exec wrangler d1 execute DB --local --file="seeds/{{.BAND}}/{{.N}}"
        OUT=$(pnpm exec wrangler d1 execute DB --local --json --file=seeds/_verify.sql)
        echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s).flatMap(x=>x.results||[]);if(rows.length){for(const r of rows)console.log(JSON.stringify(r));console.error('evidence verify failed: '+rows.length+' row(s)');process.exit(1)}console.log('evidence verify clean')})"

  evidence:prod:
    desc: Apply a per-band evidence update to production (explicit only; usage task evidence:prod BAND=<slug> N=<nnn-name.sql>)
    dir: api
    cmds:
      - |
        if [ -z "{{.BAND}}" ] || [ -z "{{.N}}" ]; then echo "usage: task evidence:prod BAND=<slug> N=<nnn-name.sql>" >&2; exit 2; fi
        case "{{.BAND}}/{{.N}}" in
          *..*|*/*/*) echo "refusing BAND/N with .. or extra separators: seeds/<slug>/<nnn-name.sql>" >&2; exit 2;;
          *.sql) ;;
          *) echo "refusing N without .sql suffix" >&2; exit 2;;
        esac
        pnpm exec wrangler d1 execute DB --remote --file="seeds/{{.BAND}}/{{.N}}"
        OUT=$(pnpm exec wrangler d1 execute DB --remote --json --file=seeds/_verify.sql)
        echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const rows=JSON.parse(s).flatMap(x=>x.results||[]);if(rows.length){for(const r of rows)console.log(JSON.stringify(r));console.error('evidence verify failed: '+rows.length+' row(s)');process.exit(1)}console.log('evidence verify clean')})"

  scrape:
    desc: Run ingestion CLI (preview only unless confirmed with [Y/n])
    dir: cli-agent
    cmd: 'go run ./cmd/cli-agent scrape {{.CLI_ARGS}}'
